<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klarbrief</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#1d1d1f;--muted:#6b6b70;--red:#c8261b;--ok:#2f6b3a;--okbg:#e6f1e8;--near:#7a5a00;--nearbg:#fdf1cf;--mark:#ffe08a;--line:#e3ded6}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#232326;--ink:#ececee;--muted:#a1a1a8;--red:#ff6b5e;--ok:#8fd19e;--okbg:#1f3324;--near:#f3c969;--nearbg:#3a3015;--mark:#806a1f;--line:#38383c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"DejaVu Sans",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:18px 24px}
.logo{width:40px;height:40px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:24px}
header h1{font-size:26px;margin:0;letter-spacing:-.5px}
header p{margin:0;color:var(--muted);font-size:14px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding:0 24px 24px}
@media (max-width:860px){main{grid-template-columns:1fr;padding:0 16px 16px}header{padding:16px}}
.panel{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
label{font-size:13px;color:var(--muted)}
select,button,textarea{font:inherit;color:var(--ink)}
select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:440px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--card);resize:vertical;font-family:"DejaVu Serif",Georgia,serif;font-size:15px}
#letterView{white-space:pre-wrap;font-family:"DejaVu Serif",Georgia,serif;font-size:15px;line-height:1.6;min-height:440px;padding:14px;border:1px solid var(--line);border-radius:8px;display:none;overflow-wrap:anywhere}
mark{background:transparent;border-bottom:2px solid var(--mark);transition:background .15s;border-radius:3px;color:inherit}
mark.hot{background:var(--mark)}
button.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer}
button.primary:disabled{opacity:.6;cursor:wait}
button.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.summary{font-size:17px;margin:0 0 14px}
.meta{font-size:13px;color:var(--muted);margin-bottom:12px}
.card{border-left:6px solid var(--red);background:var(--card);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:default}
.card:hover{outline:2px solid var(--mark)}
.k{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.v{font-size:18px;font-weight:650;margin:2px 0 6px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;margin-right:8px;background:var(--okbg);color:var(--ok)}
.chip.near{background:var(--nearbg);color:var(--near)}
.q{font-family:"DejaVu Serif",Georgia,serif;font-size:14px;color:var(--ok)}
.q.near{color:var(--near)}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details summary{cursor:pointer;color:var(--muted)}
details li{margin:6px 0;font-size:14px}
.err{background:#fde8e6;color:#8a1c12;border-radius:8px;padding:10px 12px}
.empty{color:var(--muted)}
.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
footer{color:var(--muted);font-size:12px;padding:0 24px 24px}
</style>
</head>
<body>
<header>
  <div class="logo">✓</div>
  <div><h1>Klarbrief</h1><p>Official letters explained in your language. Every point quotes the line it came from, and is checked against the letter.</p></div>
</header>
<main>
  <section class="panel">
    <div class="row">
      <label for="sample">Sample letter</label>
      <select id="sample"><option value="">Paste your own…</option></select>
    </div>
    <textarea id="letter" placeholder="Paste the text of a letter from a Swiss authority here." dir="auto"></textarea>
    <div id="letterView" dir="auto"></div>
    <div class="row" style="margin-top:12px">
      <label for="lang">Explain in</label>
      <select id="lang"></select>
      <button class="primary" id="go">Explain</button>
      <button class="link" id="edit" style="display:none">Edit letter</button>
    </div>
  </section>
  <section class="panel" id="out">
    <p class="empty">Pick a sample letter or paste one, choose your language, and press <b>Explain</b>.</p>
  </section>
</main>
<footer id="foot"></footer>
<script>
const $ = s => document.querySelector(s);
const LABEL = {action:"What to do", deadline:"By when", amount:"How much", consequence:"If you don't", contact:"Who to contact", sender:"From", topic:"About"};
const ORDER = ["action","deadline","amount","consequence","contact","topic","sender"];
let letters = [], cfg = {}, current = "";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function init(){
  cfg = await (await fetch("/api/config")).json();
  letters = await (await fetch("/api/letters")).json();
  const s = $("#sample");
  for (const l of letters){ const o = document.createElement("option"); o.value = l.id; o.textContent = `${l.lang.toUpperCase()} · ${l.kind}`; s.appendChild(o); }
  const ls = $("#lang");
  for (const [code, name] of Object.entries(cfg.languages)){
    const o = document.createElement("option"); o.value = code;
    o.textContent = name + (cfg.mode === "replay" && !cfg.replay_languages.includes(code) ? " (needs live model)" : "");
    ls.appendChild(o);
  }
  $("#foot").innerHTML = `Mode: <b>${cfg.mode}</b> · ${esc(cfg.model)}`;
  s.onchange = () => { const l = letters.find(x => x.id === s.value); $("#letter").value = l ? l.text : ""; showEditor(); $("#out").innerHTML = '<p class="empty">Press <b>Explain</b>.</p>'; };
  $("#go").onclick = run; $("#edit").onclick = showEditor;
  const first = letters.find(l => l.id === "de-01"); if (first){ s.value = first.id; $("#letter").value = first.text; }
}
function showEditor(){ $("#letter").style.display = "block"; $("#letterView").style.display = "none"; $("#edit").style.display = "none"; }
function renderLetter(text, points){
  const spans = points.filter(p => p.start != null).map((p, i) => ({...p, i})).sort((a, b) => a.start - b.start || b.end - a.end);
  let html = "", pos = 0;
  for (const p of spans){ if (p.start < pos) continue; html += esc(text.slice(pos, p.start)) + `<mark data-i="${p.i}">${esc(text.slice(p.start, p.end))}</mark>`; pos = p.end; }
  html += esc(text.slice(pos));
  $("#letterView").innerHTML = html; $("#letter").style.display = "none"; $("#letterView").style.display = "block"; $("#edit").style.display = "inline";
}
function hot(i, on){ document.querySelectorAll(`mark[data-i="${i}"]`).forEach(m => { m.classList.toggle("hot", on); if (on) m.scrollIntoView({block:"nearest", behavior:"smooth"}); }); }

async function run(){
  current = $("#letter").value; const lang = $("#lang").value;
  if (!current.trim()) return;
  $("#go").disabled = true;
  $("#out").innerHTML = `<p class="empty"><span class="spin"></span>Apertus is reading the letter…</p>`;
  let r, d;
  try { r = await fetch("/api/explain", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({letter: current, lang})}); d = await r.json(); }
  catch(e){ d = {error: String(e)}; r = {ok:false}; }
  $("#go").disabled = false;
  if (!r.ok || !d.explanation){ $("#out").innerHTML = `<div class="err">${esc(d.error || "The model reply could not be read.")}</div>`; return; }
  const e = d.explanation, shown = e.shown;
  const all = shown.map((p, i) => ({...p, i}));
  renderLetter(current, shown);
  let html = `<div class="meta">${d.mode === "replay" ? `Replayed reply from <b>${esc(d.model)}</b>, recorded ${esc((d.recorded_at||"").slice(0,10))}` : `Live · ${esc(d.model)}`} · ${d.seconds != null ? Math.round(d.seconds) + " s" : ""}<span class="badge">${shown.length} checked</span>${e.unverified.length ? `<span class="badge">${e.unverified.length} not shown</span>` : ""}</div>`;
  html += `<p class="summary" dir="auto">${esc(e.summary)}</p>`;
  for (const kind of ORDER){
    for (const p of all.filter(x => x.kind === kind)){
      let when = "";
      if (kind === "deadline" && p.date){ const d = new Date(p.date + "T12:00:00"); try { when = d.toLocaleDateString(lang, {day:"numeric", month:"long", year:"numeric"}); } catch(_) { when = p.date; } }
      const value = when ? when + " · " : (kind === "amount" && p.chf != null ? `CHF ${p.chf.toFixed(2)} · ` : "");
      const near = p.match !== "exact";
      const chip = {exact: "✓ in letter", near: "≈ in letter", partial: "≈ partly in letter"}[p.match] || "✓ in letter";
      html += `<div class="card" data-i="${p.i}"><div class="k">${LABEL[kind]}</div><div class="v" dir="auto">${esc(value)}${esc(p.text)}</div>
        <span class="chip ${near ? "near" : ""}">${chip}</span><span class="q ${near ? "near" : ""}">“${esc(p.evidence)}”</span>${p.date_from_letter ? '<div class="empty" style="font-size:12px;margin-top:4px">Date read from these words of the letter.</div>' : ""}</div>`;
    }
  }
  if (e.unverified.length){
    html += `<details><summary>Not shown as fact (${e.unverified.length}): Apertus said these, but the letter does not back them up</summary><ul>` +
      e.unverified.map(p => `<li><b>${LABEL[p.kind] || p.kind}:</b> <span dir="auto">${esc(p.text)}</span><br><span class="empty">${esc(p.reason)}${p.quote ? ` · quoted: “${esc(p.quote)}”` : ""}</span></li>`).join("") + `</ul></details>`;
  }
  $("#out").innerHTML = html;
  document.querySelectorAll(".card").forEach(c => { c.onmouseenter = () => hot(c.dataset.i, true); c.onmouseleave = () => hot(c.dataset.i, false); });
}
init();
</script>
</body>
</html>
